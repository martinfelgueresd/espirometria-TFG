version: '3'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - modelo
    networks:
      - app-network

  modelo:
    build: ./modelo
    ports:
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge