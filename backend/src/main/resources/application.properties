spring.application.name=AppEspirometrias
spring.main.web-application-type=servlet

spring.datasource.url=jdbc:postgresql://localhost:5432/appEspirometrias
spring.datasource.username=postgres
spring.datasource.password=Pandu25.
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update: crea las tablas si no existen y añade las columnas nuevas, pero conserva los datos al reiniciar.
# (create-drop borraba toda la base de datos cada vez que se paraba la aplicación).
spring.jpa.hibernate.ddl-auto=update
# Escribe en el log cada consulta SQL: solo para depurar, porque ralentiza la aplicación y llena el log.
spring.jpa.show-sql=false
